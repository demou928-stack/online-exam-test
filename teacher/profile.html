<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Profile</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo">👤 Teacher Profile</div>
    <div class="nav-links">
      <a href="dashboard.html">← Dashboard</a>
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>
  <div class="container">
    <div class="card" style="max-width:500px;margin:0 auto">
      <h2 class="card-title">My Profile</h2>
      <div id="profile-info">Loading...</div>
      <hr class="mt-2 mb-2" />
      <h3>School Logo</h3>
      <input type="file" id="logo-file" accept="image/*" class="form-control" />
      <button class="btn btn-primary btn-sm mt-1" onclick="uploadLogo()">Upload Logo</button>
      <div id="logo-preview" class="mt-2"></div>
    </div>
  </div>
  <script src="../js/firebase-config.js"></script>
  <script>
    let currentUser = null;
    function toggleTheme() {
      const html = document.documentElement;
      const dark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', dark ? 'light' : 'dark');
      localStorage.setItem('theme', dark ? 'light' : 'dark');
    }
    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    function logout() { auth.signOut().then(() => location.href = '../index.html'); }

    async function init() {
      currentUser = await requireAuth('teacher');
      document.getElementById('profile-info').innerHTML = `
        <p><strong>Name:</strong> ${currentUser.name}</p>
        <p><strong>Email:</strong> ${currentUser.email}</p>
        <p><strong>Role:</strong> Teacher</p>
      `;
      if (currentUser.logoUrl) {
        document.getElementById('logo-preview').innerHTML = `<img src="${currentUser.logoUrl}" style="max-height:80px" />`;
      }
    }

    async function uploadLogo() {
      const file = document.getElementById('logo-file').files[0];
      if (!file) return alert('Select a file');
      const ref = storage.ref('school-logo/' + currentUser.uid);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      await db.collection('users').doc(currentUser.uid).update({ logoUrl: url });
      document.getElementById('logo-preview').innerHTML = `<img src="${url}" style="max-height:80px" />`;
      alert('Logo uploaded!');
    }
    init();
  </script>
</body>
</html>
