<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Test</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo">✏️ Edit Test</div>
    <div class="nav-links">
      <a href="dashboard.html">← Dashboard</a>
    </div>
  </nav>
  <div class="container">
    <div class="card">
      <h2>Edit Test</h2>
      <p class="text-muted">Full edit functionality uses the same form as Create Test. For now you can:</p>
      <ul style="margin:1rem 0 1rem 1.5rem">
        <li>Delete the test and recreate it, or</li>
        <li>Extend this page by loading the test data into the create-test form (copy create-test.html logic and pre-fill).</li>
      </ul>
      <p>Test ID: <code id="tid"></code></p>
      <button class="btn btn-danger mt-2" onclick="deleteTest()">Delete This Test</button>
      <a href="dashboard.html" class="btn btn-outline mt-2">Back</a>
    </div>
  </div>
  <script src="../js/firebase-config.js"></script>
  <script>
    async function init() {
      await requireAuth('teacher');
      const id = new URLSearchParams(location.search).get('id');
      document.getElementById('tid').textContent = id || 'none';
      window._testId = id;
    }
    async function deleteTest() {
      if (!window._testId || !confirm('Delete this test and all its questions?')) return;
      // Delete questions
      const qs = await db.collection('questions').where('testId', '==', window._testId).get();
      const batch = db.batch();
      qs.forEach(d => batch.delete(d.ref));
      batch.delete(db.collection('tests').doc(window._testId));
      await batch.commit();
      alert('Test deleted');
      location.href = 'dashboard.html';
    }
    init();
  </script>
</body>
</html>
