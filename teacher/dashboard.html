<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard – Online Exam</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo">📚 Teacher Portal</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="create-test.html">Create Test</a>
      <a href="results.html">Results</a>
      <a href="students.html">Students</a>
      <a href="profile.html">Profile</a>
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-2">Welcome, <span id="teacher-name">Teacher</span></h2>

    <!-- Stats -->
    <div class="grid grid-4 mb-2" id="stats">
      <div class="stat-card"><div class="value" id="stat-students">0</div><div class="label">Total Students</div></div>
      <div class="stat-card"><div class="value" id="stat-tests">0</div><div class="label">Total Tests</div></div>
      <div class="stat-card"><div class="value" id="stat-avg">0%</div><div class="label">Average Score</div></div>
      <div class="stat-card"><div class="value" id="stat-highest">0%</div><div class="label">Highest Score</div></div>
    </div>

    <div class="grid grid-2">
      <!-- Recent Tests -->
      <div class="card">
        <div class="flex-between mb-2">
          <h3 class="card-title" style="margin:0">My Tests</h3>
          <a href="create-test.html" class="btn btn-primary btn-sm">+ New Test</a>
        </div>
        <div id="tests-list">Loading...</div>
      </div>

      <!-- Announcements -->
      <div class="card">
        <h3 class="card-title">Announcements</h3>
        <div class="form-group">
          <input type="text" id="ann-title" class="form-control" placeholder="Title" />
        </div>
        <div class="form-group">
          <textarea id="ann-msg" class="form-control" placeholder="Message" rows="2"></textarea>
        </div>
        <button class="btn btn-primary btn-sm" onclick="postAnnouncement()">Post</button>
        <div id="ann-list" class="mt-2"></div>
      </div>
    </div>

    <!-- Chart -->
    <div class="card mt-3">
      <h3 class="card-title">Performance Overview</h3>
      <canvas id="scoreChart" height="100"></canvas>
    </div>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script>
    let currentUser = null;

    function toggleTheme() {
      const html = document.documentElement;
      const dark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', dark ? 'light' : 'dark');
      localStorage.setItem('theme', dark ? 'light' : 'dark');
    }
    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    function logout() {
      auth.signOut().then(() => window.location.href = '../index.html');
    }

    async function init() {
      currentUser = await requireAuth('teacher');
      document.getElementById('teacher-name').textContent = currentUser.name || 'Teacher';
      loadStats();
      loadTests();
      loadAnnouncements();
    }

    async function loadStats() {
      const studentsSnap = await db.collection('users').where('role', '==', 'student').get();
      document.getElementById('stat-students').textContent = studentsSnap.size;

      const testsSnap = await db.collection('tests').where('createdBy', '==', currentUser.uid).get();
      document.getElementById('stat-tests').textContent = testsSnap.size;

      const subsSnap = await db.collection('submissions').get();
      let scores = [];
      subsSnap.forEach(d => {
        const s = d.data();
        if (s.percentage != null) scores.push(s.percentage);
      });
      if (scores.length) {
        const avg = (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1);
        document.getElementById('stat-avg').textContent = avg + '%';
        document.getElementById('stat-highest').textContent = Math.max(...scores).toFixed(1) + '%';
      }
      // Chart
      const ctx = document.getElementById('scoreChart');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: scores.slice(0, 15).map((_,i) => 'S'+(i+1)),
          datasets: [{
            label: 'Score %',
            data: scores.slice(0, 15),
            backgroundColor: '#1a56db'
          }]
        },
        options: { scales: { y: { beginAtZero: true, max: 100 } }, plugins: { legend: { display: false } } }
      });
    }

    async function loadTests() {
      const snap = await db.collection('tests')
        .where('createdBy', '==', currentUser.uid)
        .orderBy('createdAt', 'desc')
        .limit(10)
        .get();
      const list = document.getElementById('tests-list');
      if (snap.empty) {
        list.innerHTML = '<p class="text-muted">No tests yet. Create your first test!</p>';
        return;
      }
      list.innerHTML = '';
      snap.forEach(doc => {
        const t = doc.data();
        const status = t.published ? '<span class="badge badge-success">Published</span>' : '<span class="badge badge-warning">Draft</span>';
        list.innerHTML += `
          <div class="flex-between" style="padding:0.6rem 0;border-bottom:1px solid var(--border)">
            <div>
              <strong>${t.title}</strong><br>
              <small class="text-muted">${t.duration} min • ${t.totalMarks || 0} marks</small> ${status}
            </div>
            <div class="flex gap-1">
              <a href="edit-test.html?id=${doc.id}" class="btn btn-outline btn-sm">Edit</a>
              <a href="results.html?test=${doc.id}" class="btn btn-primary btn-sm">Results</a>
            </div>
          </div>`;
      });
    }

    async function loadAnnouncements() {
      const snap = await db.collection('announcements').orderBy('createdAt', 'desc').limit(5).get();
      const list = document.getElementById('ann-list');
      list.innerHTML = '';
      snap.forEach(doc => {
        const a = doc.data();
        list.innerHTML += `<div style="padding:0.5rem 0;border-bottom:1px solid var(--border)">
          <strong>${a.title}</strong><br><small>${a.message}</small>
        </div>`;
      });
    }

    async function postAnnouncement() {
      const title = document.getElementById('ann-title').value.trim();
      const message = document.getElementById('ann-msg').value.trim();
      if (!title || !message) return alert('Title and message required');
      await db.collection('announcements').add({
        title, message,
        createdBy: currentUser.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      document.getElementById('ann-title').value = '';
      document.getElementById('ann-msg').value = '';
      loadAnnouncements();
    }

    init();
  </script>
</body>
</html>
