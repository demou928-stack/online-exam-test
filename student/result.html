<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Result – Online Exam</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo">📋 Result</div>
    <div class="nav-links">
      <a href="dashboard.html">← Dashboard</a>
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </div>
  </nav>
  <div class="container">
    <div class="card" id="result-card">
      <p class="text-muted">Loading result...</p>
    </div>
  </div>
  <script src="../js/firebase-config.js"></script>
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const dark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', dark ? 'light' : 'dark');
      localStorage.setItem('theme', dark ? 'light' : 'dark');
    }
    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    async function init() {
      const user = await requireAuth('student');
      const testId = new URLSearchParams(location.search).get('test');
      if (!testId) { location.href = 'dashboard.html'; return; }

      const snap = await db.collection('submissions')
        .where('studentId', '==', user.uid)
        .where('testId', '==', testId)
        .limit(1).get();
      if (snap.empty) {
        document.getElementById('result-card').innerHTML = '<p>No result found.</p>';
        return;
      }
      const r = snap.docs[0].data();
      const testDoc = await db.collection('tests').doc(testId).get();
      const title = testDoc.exists ? testDoc.data().title : testId;

      document.getElementById('result-card').innerHTML = `
        <h2 class="card-title">${title}</h2>
        <div class="grid grid-2 mt-2">
          <div><strong>Student:</strong> ${r.studentName}</div>
          <div><strong>Roll No:</strong> ${r.rollNumber}</div>
          <div><strong>Class/Section:</strong> ${r.class} / ${r.section}</div>
          <div><strong>Status:</strong> <span class="badge ${r.status==='completed'?'badge-success':'badge-warning'}">${r.status}</span></div>
          <div><strong>Score:</strong> ${r.score} / ${r.totalMarks}</div>
          <div><strong>Percentage:</strong> ${r.percentage?.toFixed(1)}%</div>
          <div><strong>Submitted:</strong> ${r.submittedAt ? new Date(r.submittedAt.toDate()).toLocaleString() : '-'}</div>
          <div><strong>Time Taken:</strong> ${r.timeTaken ? Math.floor(r.timeTaken/60)+' min '+ (r.timeTaken%60)+' sec' : '-'}</div>
        </div>
        <div class="mt-3">
          <button class="btn btn-primary" onclick="window.print()">🖨️ Print Result</button>
        </div>
      `;
    }
    init();
  </script>
</body>
</html>
